name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install dependencies
        run: sudo DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt-get install -y \
          $(cat .github/workflows/build-dependencies.txt)
      # The CMake build builds every dependency from source: cpython (when
      # contrib/cpython/python is absent), linkpy (when linker/dist/audit.so is
      # absent), and the liballocs / alaska submodules (BUILD_LIBALLOCS /
      # BUILD_ALASKA, on by default).
      - name: Configure (CMake)
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j $(nproc)
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

