name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install dependencies
        run: sudo DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt-get install -y \
          $(cat .github/workflows/build-dependencies.txt)
      # liballocs and alaska are submodules of stackscan and must be built there
      # first; pycallocs consumes them as pre-built dependencies.
      - name: Build contrib (cpython, linkpy)
        run: make -C contrib -j $(nproc)
      - name: Configure (CMake)
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j $(nproc)
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

